<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fast Repair</title>
    <link rel="icon" href="images/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Верхняя панель -->
    <header>
        <div class="top-bar"></div>
        <nav class="main-nav">
            <div class="logo">Fast Repair</div>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="price.html">Цены</a></li>
                <li><a href="how_to.html">Партнёры</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <!-- Баннер -->
    <div class="banner">
        <img src="images/banner.png" alt="HOME">
    </div>

    <!-- Основной контент -->
    <main>
        <section class="about-section">
            <h1>О нашем автосервисе</h1>
            <div class="about-content">
                <div class="about-text">
                    <iframe src="About_Text.html" frameborder="0"></iframe>
                </div>
                <div class="about-image">
                    <a href="about.html">
                        <img src="images/dvs.png" alt="О нашем автосервисе">
                    </a>
                </div>
            </div>
        </section>

        <!-- Сервисы -->
        <section class="services">
            <div class="service-grid">
                <a href="E-BOOKS.html" class="service-card">
                    <img src="images/eBooks.jpg" alt="E-BOOKS">
                    <span>Диагностика</span>
                </a>
                <!-- Остальные карточки сервисов -->
            </div>
        </section>

        <!-- Партнеры -->
        <section class="partners">
            <h2>Наши партнеры</h2>
            <div class="partner-slider">
                <!-- Партнеры будут здесь -->
            </div>
        </section>
    </main>

    <!-- Футер -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Наши спонсоры</h3>
                <div class="sponsors-links">
                    <!-- Ссылки на спонсоров -->
                </div>
            </div>
            <div class="footer-section">
                <h3>Соц. сети</h3>
                <div class="social-icons">
                    <!-- Иконки соцсетей -->
                </div>
            </div>
            <div class="footer-section">
                <h3>Контакты</h3>
                <div class="contact-info">
                    <!-- Контактная информация -->
                </div>
            </div>
        </div>
        <div class="copyright">
            © Copyright Fast Repair 2024
        </div>
    </footer>
</body>
</html>
